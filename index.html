<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>

    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/default.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/basket.css">

    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/script.js"></script>

</head>

<body onload="init()">

    <nav>
        <div class="content nav-content">
            <a href="">
                <img src="./assets/icons/bestellapp.svg" alt="Bestellapp Logo">
            </a>

            <!-- Hamburger Icon Button Platzhalter bis Code fertig-->
            <img src="./assets/icons/menu.png" alt="">
        </div>
    </nav>

    <div class="content">

        <header class="hero-section">
            <img src="./assets/img/burgerhouse-logo.png" alt="Burgerhouse Logo">
        </header>

        <section class="restaurant-info">
            <div class="restaurant-title">
                <h1><span class="title-accent">Burger</span>House</h1>
                <div class="rating">
                    <img class="rating-star" src="./assets/icons/rating-star.svg" alt="Sterne">
                    <span class="rating-value">4,1</span>
                    <span class="rating-count">(317)</span>
                </div>
            </div>
            <p class="restaurant-subtitle">Das Beste aus Burgern, Pizza und Salaten – alles an einem großartigen Ort.
            </p>
        </section>

        <div class="menu-layout">
            <main id="menu"></main>

            <div class="basket-wrapper">
                <aside class="basket">
                    <h3>Dein Warenkorb</h3>
                    <p>Hier ist nichts zu finden.</p>
                    <p>Wähle aus unseren leckeren Gerichten!</p>
                    <img class="basket-icon" src="./assets/icons/shopping_cart.svg" alt="Warenkorb">
                </aside>
            </div>
        </div>

        <div id="dialog-container"></div>

    </div>

    <footer>
        <div class="content footer-content">
            <span>© 2025 BurgerHouse</span>
            <a href="">Imprint</a>
            <a href="">Cookie Preferences</a>
        </div>
    </footer>

</body>

</html>
